<div class="classic-pane b">
  <h3 align="center">FCSA MICS <span id="sdf-type-long">Antenna</span> Subsidiary Files</h3>
  <div id="sdf-tree-status" class="classic-status" align="center"></div>
  <p align="center">
    Type:
    <select id="sdf-type">
      <option>Ante</option><option>Band</option><option>Ctx</option><option>Eqpt</option>
      <option>Oper</option><option>Plan</option><option>Rout</option><option>Note</option>
      <option>Towr</option><option>Town</option><option>Traf</option>
    </select>
    <button type="button" class="bt" id="sdf-create">Create new</button>
    <button type="button" class="bt" id="sdf-refresh">Refresh</button>
    <button type="button" class="bt" id="sdf-help">Help</button>
    Find: <input id="sdf-tree-find" class="im" size="24" maxlength="40" title="Searches the selected file first">
    <input type="button" class="bt" id="sdf-tree-find-go" value="Find" title="Find in selected file, then Find Next across the tree">
  </p>
  <div id="sdf-tree-host" class="classic-tree-host" style="max-height:18rem; overflow:auto;"></div>
</div>
